<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lámina de Lo que la luz dejó atrás</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#120b08;color:#f4ecdc;font:1.05rem/1.5 Georgia,serif;text-align:center;padding:24px}
form{max-width:420px;width:100%}
b{color:#f0c066}
input{width:100%;box-sizing:border-box;margin:14px 0 6px;padding:12px 14px;border-radius:10px;border:1px solid #6b5a3a;background:#1c130d;color:#f4ecdc;font:1rem sans-serif}
button{margin-top:10px;background:#f0c066;color:#1a1206;font:700 1rem sans-serif;padding:12px 26px;border:0;border-radius:99px;cursor:pointer}
small{display:block;color:#bfae8c;margin-top:14px;font-size:.85rem}
#err{color:#ff9d8a;min-height:1.2em;font:.9rem sans-serif}
a{color:#f0c066}
</style>
</head>
<body>
<form id="f" novalidate>
<p>Lámina <b id="n"></b> de <i>Lo que la luz dejó atrás</i> · <b>0,50 €</b></p>
<p id="t"></p>
<label for="email">¿A qué correo te la envío?</label>
<input id="email" type="email" inputmode="email" autocomplete="email" placeholder="tu@correo.com" required>
<div id="err" role="alert"></div>
<button type="submit">Pagar 0,50 € con PayPal</button>
<small>Pasarás a PayPal con el importe ya puesto. En cuanto vea el pago, te mando la lámina sin velar a ese correo.</small>
<small><a href="../tienda/#luz">Ver todas las láminas</a></small>
</form>
<script>
var TITULOS = ["La vuelta al pueblo", "El molino viejo", "Los ecos de la cocina", "Mateo, al amanecer", "El mostrador", "El hueco", "Despedirse", "El rodeo", "El arco de piedra", "Todos los ecos"];
var n = parseInt(new URLSearchParams(location.search).get('n'), 10);
if (!(n >= 1 && n <= TITULOS.length)) { location.replace('../tienda/#luz'); n = 0; }
document.getElementById('n').textContent = n ? n : '';
document.getElementById('t').innerHTML = n ? '<i>' + TITULOS[n - 1] + '</i>' : '';
window.PAGO = { importe: '0.50', item: 'Lámina ' + n + ' · ' + (n ? TITULOS[n - 1] : '') + ' · Lo que la luz dejó atrás' };
</script>
<script src="../pago.js"></script>
</body>
</html>
